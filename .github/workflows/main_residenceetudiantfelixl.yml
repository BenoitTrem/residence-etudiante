	# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
	# More GitHub Actions for Azure: https://github.com/Azure/actions
	
	name: Build, test and deploy to Azure Web App
	
	on:
	  push:
	    branches: [ "main", "dev" ]
	  pull_request:
	    branches: [ "main", "dev" ]
	  workflow_dispatch:
	
	jobs:
	  test:
	    runs-on: ubuntu-latest
	  
	    steps:
	    - uses: actions/checkout@v6
	    
	    - name: Setup .NET
	      uses: actions/setup-dotnet@v5
	      with:
	        dotnet-version: '10.x'
	        
	    - name: Restore dependencies
	      run: dotnet restore
	      
	    - name: Build
	      run: dotnet build --no-restore
	      
	    - name: Test
	      run: dotnet test --no-build --verbosity normal
	        
	  build:
	    runs-on: windows-latest
	    needs: test ##Pas de build si les tests ne passent pas
	    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
	    permissions:
	      contents: read #This is required for actions/checkout
	
	    steps:
	      - uses: actions/checkout@v6
	
	      - name: Set up .NET Core
	        uses: actions/setup-dotnet@v5
	        with:
	          dotnet-version: '10.x'
	
	      - name: Build with dotnet
	        run: dotnet build --configuration Release
	
	      - name: dotnet publish
	        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"
	
	      - name: Upload artifact for deployment job
	        uses: actions/upload-artifact@v4
	        with:
	          name: .net-app
	          path: ${{env.DOTNET_ROOT}}/myapp
	
	  deploy:
	    runs-on: windows-latest
	    needs: build
	    permissions:
	      id-token: write #This is required for requesting the JWT
	      contents: read #This is required for actions/checkout
	
	    steps:
	      - name: Download artifact from build job
	        uses: actions/download-artifact@v5
	      
	      - name: Login to Azure
	        uses: azure/login@v3
	        with: ##Garder VOS secrets
	          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_X }}
	          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_Y }}
	          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_Z }}
	
	      - name: Deploy to Azure Web App
	        id: deploy-to-webapp
	        uses: azure/webapps-deploy@v3
	        with:
	          app-name: 'AppName'Ex
	          slot-name: 'Production'
	          package: ./.net-app
